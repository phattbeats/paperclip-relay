name: build-ios

# PHA-5156 — Paperclip Relay, the native iOS client for the Paperclip board.
#
# Runs on a macOS runner: Xcode's iOS SDK is the only place an .app can be
# assembled for a device.
#
# The deliverable is an *unsigned* .ipa. "Sideloaded only, no licensing" is
# the whole point of this issue: nothing here needs an Apple Developer
# Program account, an App Store record, or a provisioning profile. The .ipa
# is sideloaded with AltStore/SideStore (or signed locally with a personal
# team).
#
# The repo is public, so the macOS runner minutes are free.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build-ios:
    # The modern lane compiles against Xcode 26 / iOS 26. The deployment
    # target remains iOS 16.0 — new APIs are availability-gated in source.
    # GitHub's public macos-26 image ships Xcode 26.6 and iOS 26.5 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Install XcodeGen
        # The Xcode project is generated from ios/project.yml rather than
        # committed, so there is no machine-written .xcodeproj to merge.
        run: brew install xcodegen

      - name: Build the app (unsigned, device)
        run: |
          chmod +x ./ios/build-ios.sh
          ./ios/build-ios.sh

      - name: Build the app (simulator, ad-hoc signed)
        # The simulator build is the one a human can run without a device,
        # so it is worth proving it compiles. It is signed ad-hoc ("-")
        # rather than unsigned: an unsigned simulator build has no keychain
        # entitlement, and the Keychain refuses the write with -34018, which
        # leaves the app unable to hold a board key at all. The shipped
        # .ipa below stays unsigned.
        run: |
          cd ios
          xcodegen generate
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project Relay.xcodeproj \
            -scheme Relay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedDataSim \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            build | tee build/xcodebuild-simulator.log

      - name: Package the .ipa
        # build-ios.sh already produced the .ipa on the device build. This
        # step re-checks it and fails loudly if the Payload layout is wrong,
        # because a malformed .ipa installs as nothing at all.
        run: |
          cd ios
          APP="build/DerivedData/Build/Products/Release-iphoneos/Relay.app"
          test -d "$APP"
          rm -rf build/Payload build/Relay-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry Relay-unsigned.ipa Payload
          ls -la Relay-unsigned.ipa
          # No pipes into head/grep here: the reader exits early, unzip takes
          # a SIGPIPE, and the step fails on a perfectly good .ipa.
          unzip -l Relay-unsigned.ipa > ipa-listing.txt
          head -25 ipa-listing.txt
          grep -q "Payload/Relay.app/Info.plist" ipa-listing.txt \
            || { echo "::error::the .ipa has no Payload/Relay.app/Info.plist"; exit 1; }

      - name: Verify the deployment target
        # The whole point of this client is that it runs on iOS 16. If the
        # build ever raises the floor, this fails and the card says so.
        run: |
          plutil -p ios/build/Payload/Relay.app/Info.plist | grep -E "MinimumOSVersion|CFBundleIdentifier"
          MIN=$(plutil -extract MinimumOSVersion raw ios/build/Payload/Relay.app/Info.plist)
          echo "MinimumOSVersion = $MIN"
          case "$MIN" in
            16.*|15.*) echo "deployment target is $MIN — iOS 16 supported" ;;
            *) echo "::error::deployment target is $MIN, but this client must run on iOS 16"; exit 1 ;;
          esac

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-relay-ios-unsigned-ipa
          path: ios/build/Relay-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Stage the simulator app
        # Copy the built .app under a known path so the artifact keeps the
        # Relay.app wrapper. upload-artifact roots an artifact at the least
        # common ancestor of the files it stores, which flattens a bare
        # "…/Relay.app" path and loses the wrapper.
        run: |
          mkdir -p ios/build/simulator
          cp -R ios/build/DerivedDataSim/Build/Products/Debug-iphonesimulator/Relay.app \
            ios/build/simulator/Relay.app
          ls -la ios/build/simulator/Relay.app

      - name: Upload the simulator app
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-relay-ios-simulator-app
          path: ios/build/simulator
          if-no-files-found: error
          retention-days: 14

  screenshots:
    # Modern screenshots, taken on an iOS 26 simulator against the live
    # board. The board key comes from the repository secret, never from the
    # repository itself.
    runs-on: macos-26
    needs: build-ios
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    if: ${{ success() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the simulator build
        uses: actions/download-artifact@v4
        with:
          name: paperclip-relay-ios-simulator-app
          path: ios/build/simulator

      - name: Boot an iPhone simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no iPhone simulator available")
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # A runner can come back with a half-booted simulator from a
          # previous job. Clear them before booting, and never wait on
          # bootstatus forever — a wedged simulator must not wedge the
          # release.
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" || true
          ( xcrun simctl bootstatus "$UDID" -b && echo "SIM_BOOTED" ) &
          BOOT_PID=$!
          for _ in $(seq 1 48); do
            kill -0 "$BOOT_PID" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$BOOT_PID" 2>/dev/null; then
            echo "simulator did not report boot in time; carrying on anyway"
            kill "$BOOT_PID" 2>/dev/null || true
            xcrun simctl shutdown all >/dev/null 2>&1 || true
            xcrun simctl boot "$UDID" || true
            sleep 45
          fi
          xcrun simctl list devices | grep -i "$UDID" || true

      - name: Install the app
        run: |
          xcrun simctl install "$UDID" ios/build/simulator/Relay.app

      - name: Screenshot each tab
        env:
          RELAY_BOARD_TOKEN: ${{ secrets.RELAY_BOARD_TOKEN }}
          RELAY_COMPANY_ID: ${{ secrets.RELAY_COMPANY_ID }}
          RELAY_BASE_URL: https://paperclip.phatt.vip
          # The issue whose detail screen is captured with the toast on it,
          # and the toast text. The toast names the issue's real status so
          # the capture does not contradict the status badge on screen.
          RELAY_CAPTURE_ISSUE_ID: 8f2c582b-9f54-47fa-9f34-768a198edd97
          RELAY_CAPTURE_BANNER: "Status set to in review."
        run: |
          set -euo pipefail
          mkdir -p screenshots
          CONTAINER=$(xcrun simctl get_app_container "$UDID" tech.phatt.papercliprelay data)
          mkdir -p "$CONTAINER/Documents"
          for tab in issues console agents approvals; do
            xcrun simctl terminate "$UDID" tech.phatt.papercliprelay >/dev/null 2>&1 || true
            # The app cannot be typed into, so the configuration is written
            # into its container as a bootstrap file. The environment is
            # passed as well; whichever arrives wins.
            printf '{"baseURL":"%s","companyId":"%s","boardToken":"%s","initialTab":"%s"}' \
              "$RELAY_BASE_URL" "$RELAY_COMPANY_ID" "$RELAY_BOARD_TOKEN" "$tab" \
              > "$CONTAINER/Documents/relay-config.json"
            SIMCTL_CHILD_RELAY_BASE_URL="$RELAY_BASE_URL" \
            SIMCTL_CHILD_RELAY_COMPANY_ID="$RELAY_COMPANY_ID" \
            SIMCTL_CHILD_RELAY_BOARD_TOKEN="$RELAY_BOARD_TOKEN" \
            SIMCTL_CHILD_RELAY_INITIAL_TAB="$tab" \
              xcrun simctl launch "$UDID" tech.phatt.papercliprelay
            # The app loads the board on launch; give it time to paint.
            sleep 30
            xcrun simctl io "$UDID" screenshot "screenshots/$tab.png" || echo "capture failed: $tab"
            ls -la screenshots/
            echo "--- launch diagnostic"
            cat "$CONTAINER/Documents/relay-launch.json" || echo "no diagnostic file"
          done

          # The operator console has five panes and each one loads live
          # board data over several endpoints, so every pane is captured
          # separately. These captures are the only proof the new panes
          # render populated rather than empty.
          for pane in spend people timeline health; do
            xcrun simctl terminate "$UDID" tech.phatt.papercliprelay >/dev/null 2>&1 || true
            printf '{"baseURL":"%s","companyId":"%s","boardToken":"%s","initialTab":"console","initialConsolePane":"%s"}' \
              "$RELAY_BASE_URL" "$RELAY_COMPANY_ID" "$RELAY_BOARD_TOKEN" "$pane" \
              > "$CONTAINER/Documents/relay-config.json"
            SIMCTL_CHILD_RELAY_BASE_URL="$RELAY_BASE_URL" \
            SIMCTL_CHILD_RELAY_COMPANY_ID="$RELAY_COMPANY_ID" \
            SIMCTL_CHILD_RELAY_BOARD_TOKEN="$RELAY_BOARD_TOKEN" \
            SIMCTL_CHILD_RELAY_INITIAL_TAB="console" \
            SIMCTL_CHILD_RELAY_INITIAL_CONSOLE_PANE="$pane" \
              xcrun simctl launch "$UDID" tech.phatt.papercliprelay
            sleep 35
            xcrun simctl io "$UDID" screenshot "screenshots/console-$pane.png" || echo "capture failed: $pane"
            ls -la screenshots/
          done

          # The Run Inspector is the nightly-parity read surface. `latest`
          # asks the app to open the first run from its own timeline response,
          # so the capture proves the real phone data path rather than a
          # separate CDN-sensitive curl lookup.
          xcrun simctl terminate "$UDID" tech.phatt.papercliprelay >/dev/null 2>&1 || true
          printf '{"baseURL":"%s","companyId":"%s","boardToken":"%s","initialTab":"console","initialConsolePane":"timeline","initialRun":"latest"}' \
            "$RELAY_BASE_URL" "$RELAY_COMPANY_ID" "$RELAY_BOARD_TOKEN" \
            > "$CONTAINER/Documents/relay-config.json"
          SIMCTL_CHILD_RELAY_BASE_URL="$RELAY_BASE_URL" \
          SIMCTL_CHILD_RELAY_COMPANY_ID="$RELAY_COMPANY_ID" \
          SIMCTL_CHILD_RELAY_BOARD_TOKEN="$RELAY_BOARD_TOKEN" \
          SIMCTL_CHILD_RELAY_INITIAL_TAB="console" \
          SIMCTL_CHILD_RELAY_INITIAL_CONSOLE_PANE="timeline" \
          SIMCTL_CHILD_RELAY_INITIAL_RUN="latest" \
            xcrun simctl launch "$UDID" tech.phatt.papercliprelay
          sleep 35
          xcrun simctl io "$UDID" screenshot "screenshots/run-inspector.png" || echo "capture failed: run inspector"

          # The issue detail screen with a toast on it. The toast used to be
          # a window overlay that painted over the navigation bar and the
          # controls underneath it (PHA-5156, reported from the phone on
          # 2026-11-20). The fix gives the toast its own space as a
          # safe-area inset, and this capture is the proof: the toast sits
          # below the navigation bar and the issue controls are clear.
          xcrun simctl terminate "$UDID" tech.phatt.papercliprelay >/dev/null 2>&1 || true
          printf '{"baseURL":"%s","companyId":"%s","boardToken":"%s","initialTab":"issues","initialIssue":"%s","banner":"%s"}' \
            "$RELAY_BASE_URL" "$RELAY_COMPANY_ID" "$RELAY_BOARD_TOKEN" \
            "$RELAY_CAPTURE_ISSUE_ID" "$RELAY_CAPTURE_BANNER" \
            > "$CONTAINER/Documents/relay-config.json"
          SIMCTL_CHILD_RELAY_BASE_URL="$RELAY_BASE_URL" \
          SIMCTL_CHILD_RELAY_COMPANY_ID="$RELAY_COMPANY_ID" \
          SIMCTL_CHILD_RELAY_BOARD_TOKEN="$RELAY_BOARD_TOKEN" \
          SIMCTL_CHILD_RELAY_INITIAL_TAB="issues" \
          SIMCTL_CHILD_RELAY_INITIAL_ISSUE="$RELAY_CAPTURE_ISSUE_ID" \
          SIMCTL_CHILD_RELAY_INITIAL_BANNER="$RELAY_CAPTURE_BANNER" \
            xcrun simctl launch "$UDID" tech.phatt.papercliprelay
          sleep 35
          xcrun simctl io "$UDID" screenshot "screenshots/issue-detail-toast.png" || echo "capture failed: detail"
          ls -la screenshots/

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-relay-ios-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 30

  screenshots-ios16-fallback:
    # The fallback lane deliberately uses an iOS 18 simulator. `#available(iOS
    # 26, *)` is false there, so this proves the exact 16–25 material/tab
    # fallback path while keeping the deployment target verified at 16.0.
    # macos-15 currently carries both the iOS 18 runtime and Xcode 26.3.
    runs-on: macos-15
    needs: build-ios
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode and fallback SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun simctl list runtimes | grep -E 'iOS 18' | head -3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the iOS 16-compatible simulator app
        run: |
          cd ios
          xcodegen generate
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project Relay.xcodeproj \
            -scheme Relay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedDataFallback \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            build | tee build/xcodebuild-fallback.log

      - name: Boot an iOS 18 simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS-18" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no iOS 18 iPhone simulator available")
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Capture the iOS 16–25 fallback
        env:
          RELAY_BOARD_TOKEN: ${{ secrets.RELAY_BOARD_TOKEN }}
          RELAY_COMPANY_ID: ${{ secrets.RELAY_COMPANY_ID }}
          RELAY_BASE_URL: https://paperclip.phatt.vip
        run: |
          set -euo pipefail
          mkdir -p screenshots-fallback
          APP="ios/build/DerivedDataFallback/Build/Products/Debug-iphonesimulator/Relay.app"
          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" tech.phatt.papercliprelay data)
          mkdir -p "$CONTAINER/Documents"
          printf '{"baseURL":"%s","companyId":"%s","boardToken":"%s","initialTab":"console"}' \
            "$RELAY_BASE_URL" "$RELAY_COMPANY_ID" "$RELAY_BOARD_TOKEN" \
            > "$CONTAINER/Documents/relay-config.json"
          SIMCTL_CHILD_RELAY_BASE_URL="$RELAY_BASE_URL" \
          SIMCTL_CHILD_RELAY_COMPANY_ID="$RELAY_COMPANY_ID" \
          SIMCTL_CHILD_RELAY_BOARD_TOKEN="$RELAY_BOARD_TOKEN" \
          SIMCTL_CHILD_RELAY_INITIAL_TAB="console" \
            xcrun simctl launch "$UDID" tech.phatt.papercliprelay
          sleep 35
          xcrun simctl io "$UDID" screenshot screenshots-fallback/console-ios16-fallback.png

      - name: Upload the fallback screenshot
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-relay-ios16-fallback-screenshot
          path: screenshots-fallback
          if-no-files-found: error
          retention-days: 30
